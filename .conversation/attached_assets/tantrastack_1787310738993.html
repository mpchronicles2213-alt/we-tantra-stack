<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080711">
<title>TantraStack</title>
<style>
:root {
  --bg:#070611;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{font-family:Inter,system-ui,sans-serif}

.hero{
  position:relative;width:100vw;height:100svh;min-height:560px;
  overflow:hidden;isolation:isolate;
  background:
    radial-gradient(circle at 50% 50%,rgba(91,63,230,.13),transparent 38%),
    #070611;
}
.hero::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle at 50% 50%,black 0,transparent 72%);
}

.logo{
  position:absolute;z-index:50;left:clamp(22px,3.2vw,54px);top:clamp(18px,3vw,34px);
  color:#f7f5ff;font-size:20px;font-weight:850;letter-spacing:-.055em;
  text-shadow:0 5px 30px rgba(0,0,0,.5);
}
.logo span{color:#2be7bd}

.stage{
  position:absolute;z-index:5;left:50%;top:50%;
  width:min(900px,76vw,82vh);height:min(900px,76vw,82vh);
  transform:translate(-50%,-50%);
  transition:transform 1.05s var(--ease);
}
.art{
  position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  display:block;user-select:none;pointer-events:none;
  filter:drop-shadow(0 35px 70px rgba(0,0,0,.52));
  transition:transform 1.1s var(--ease),filter .8s var(--ease);
}
.halo{
  position:absolute;inset:7%;border-radius:50%;pointer-events:none;
  border:1px solid rgba(123,94,255,.16);
  box-shadow:0 0 90px rgba(112,77,255,.10);
  animation:halo 4.5s ease-in-out infinite;
}
@keyframes halo{50%{transform:scale(1.035);opacity:.6}}

.node{
  position:absolute;z-index:15;width:12%;height:12%;min-width:48px;min-height:48px;
  transform:translate(-50%,-50%);border:0;border-radius:50%;
  background:transparent;cursor:pointer;padding:0;outline:none;
}
.node::before{
  content:"";position:absolute;inset:-9%;border-radius:50%;
  border:1px solid transparent;
  transition:all .45s var(--ease);
}
.node::after{
  content:"";position:absolute;inset:-24%;border-radius:50%;
  border:1px solid transparent;opacity:0;
}
.node:hover::before,.node.selected::before{
  border-color:var(--c);box-shadow:0 0 22px var(--c),0 0 55px color-mix(in srgb,var(--c) 42%,transparent);
  background:radial-gradient(circle,transparent 54%,color-mix(in srgb,var(--c) 8%,transparent));
}
.node:hover::after,.node.selected::after{
  opacity:.9;border-color:color-mix(in srgb,var(--c) 45%,transparent);
  animation:ring 1.9s ease-out infinite;
}
@keyframes ring{0%{transform:scale(.7);opacity:0}25%{opacity:1}100%{transform:scale(1.45);opacity:0}}

.js{left:50%;top:12.8%;--c:#ffe34d}
.ts{left:76.5%;top:24%;--c:#3f8cff}
.py{left:88%;top:50%;--c:#ffe34d}
.sql{left:76.5%;top:76%;--c:#ff9b12}
.api{left:50%;top:88%;--c:#29e8bd}
.css{left:23.5%;top:76%;--c:#4e8fff}
.git{left:12%;top:50%;--c:#ff5337}
.db{left:23.5%;top:24%;--c:#a98cff}

.vignette{
  position:absolute;z-index:20;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,transparent 44%,rgba(4,3,11,.42) 78%,rgba(4,3,11,.78) 100%);
}
.focus{
  position:absolute;z-index:25;inset:0;opacity:0;pointer-events:none;
  transition:opacity .45s ease;
}
.focus.active{opacity:1}
.focus::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at var(--x) var(--y),
    transparent 0 7%,rgba(4,3,11,.02) 10%,rgba(4,3,11,.62) 31%,rgba(4,3,11,.88) 73%);
}
.focus-ring{
  position:absolute;z-index:30;width:clamp(90px,9vw,135px);height:clamp(90px,9vw,135px);
  left:var(--x);top:var(--y);transform:translate(-50%,-50%) scale(.7);
  border-radius:50%;border:2px solid var(--accent);
  box-shadow:0 0 30px var(--accent),0 0 90px color-mix(in srgb,var(--accent) 48%,transparent);
  opacity:0;transition:transform .8s var(--ease),opacity .45s ease;
}
.focus.active .focus-ring{transform:translate(-50%,-50%) scale(1);opacity:1}
.focus-ring::before,.focus-ring::after{
  content:"";position:absolute;inset:-14px;border-radius:50%;
  border:1px solid color-mix(in srgb,var(--accent) 48%,transparent);
}
.focus-ring::after{inset:-30px;opacity:.45;animation:ring 2.3s ease-out infinite}

.snapshot{
  position:absolute;z-index:40;top:50%;
  width:min(260px,22vw);transform:translateY(-50%);
  padding:22px 22px 20px;border:1px solid rgba(255,255,255,.12);
  border-radius:22px;background:rgba(11,9,23,.82);backdrop-filter:blur(20px);
  box-shadow:0 25px 80px rgba(0,0,0,.45);
  color:#fff;opacity:0;pointer-events:none;
  transition:opacity .6s var(--ease),transform .75s var(--ease);
}
.snapshot.show{opacity:1;transform:translateY(-50%) translateX(0);pointer-events:none}
.snapshot .tiny{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:800}
.snapshot h2{font-size:30px;line-height:1;margin:9px 0 12px;letter-spacing:-.055em}
.snapshot p{font-size:12px;line-height:1.6;color:#aaa5bb;margin:0}
.snapshot button{
  position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);
  color:#aaa;cursor:pointer;
}

.flash{display:none!important;}
.flash.go{animation:flash .7s var(--ease)}
@keyframes flash{
  0%{transform:translate(-50%,-50%) scale(0);opacity:0}
  20%{opacity:1}100%{transform:translate(-50%,-50%) scale(25);opacity:0}
}

.hero.focused .art{transform:scale(1.035);filter:drop-shadow(0 40px 90px rgba(93,67,255,.32))}
.hero.focused .node:not(.selected){opacity:.35;filter:blur(1px);pointer-events:auto}
.hero.focused .node.selected{opacity:1}
.hero.focused .stage{transform:translate(-50%,-50%) scale(1.025)}

@media(max-width:1000px){
  .stage{width:min(760px,82vw,78vh);height:min(760px,82vw,78vh)}
  .snapshot{right:18px;width:250px}
}
@media(max-width:700px){
  .logo{font-size:17px}
  .stage{width:min(680px,108vw,74vh);height:min(680px,108vw,74vh);top:53%}
  .snapshot{left:16px;right:16px;bottom:16px;top:auto;width:auto;transform:translateY(20px)}
  .snapshot.show{transform:translateY(0)}
  .vignette{background:radial-gradient(circle at 50% 50%,transparent 35%,rgba(4,3,11,.7) 100%)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

    <button class="node js" data-key="JS" aria-label="JavaScript"></button>
    <button class="node ts" data-key="TS" aria-label="TypeScript"></button>
    <button class="node py" data-key="PY" aria-label="Python"></button>
    <button class="node sql" data-key="SQL" aria-label="SQL"></button>
    <button class="node api" data-key="API" aria-label="API"></button>
    <button class="node css" data-key="CSS" aria-label="CSS"></button>
    <button class="node git" data-key="GIT" aria-label="Git"></button>
    <button class="node db" data-key="DB" aria-label="Database"></button>
  </div>

  <div class="vignette"></div>

  <div class="focus" id="focus">
    <div class="focus-ring" id="focusRing"></div>
  </div>

  <div class="snapshot" id="snapshot">
    <button id="close" aria-label="Close">×</button>
    <div class="tiny" id="snapRole">Node</div>
    <h2 id="snapTitle">JavaScript</h2>
    <p id="snapText"></p>
  </div>

  <div class="flash" id="flash"></div>
</section>

<script>
const hero = document.getElementById('hero');
const stage = document.getElementById('stage');
const focus = document.getElementById('focus');
const ring = document.getElementById('focusRing');
const snapshot = document.getElementById('snapshot');
const flash = document.getElementById('flash');

const info = {
  JS:  ['Logic','JavaScript','The interaction layer — motion, state, events and the living behavior of the experience.','#ffe34d'],
  TS:  ['Precision','TypeScript','The precision layer — stronger structure, safer interfaces and predictable system behavior.','#3f8cff'],
  PY:  ['Intelligence','Python','The intelligence layer — automation, data workflows, services and computational power.','#ffe34d'],
  SQL: ['Memory','SQL','The memory layer — structured data, relationships, queries and persistent system knowledge.','#ff9b12'],
  API: ['Connection','API','The connection layer — clean interfaces that let every part of the stack communicate.','#29e8bd'],
  CSS: ['Interface','CSS','The visual layer — composition, motion, responsive behavior and the final experience.','#4e8fff'],
  GIT: ['Versioning','Git','The evolution layer — collaboration, history and controlled changes across the system.','#ff5337'],
  DB:  ['Data','Database','The foundation of information — the place where structured application knowledge lives.','#a98cff']
};

let active = null;
let targetX = 0, targetY = 0, curX = 0, curY = 0;
let raf = 0;

window.addEventListener('pointermove', e => {
  if(active) return;
  targetX = (e.clientX / innerWidth - .5);
  targetY = (e.clientY / innerHeight - .5);
  if(!raf) raf=requestAnimationFrame(move);
}, {passive:true});

function move(){
  raf=0;
  curX += (targetX-curX)*.08;
  curY += (targetY-curY)*.08;
  stage.style.transform=`translate(calc(-50% + ${curX*14}px),calc(-50% + ${curY*10}px))`;
  if(Math.abs(targetX-curX)>.001 || Math.abs(targetY-curY)>.001) raf=requestAnimationFrame(move);
}

function selectNode(node){
  const key=node.dataset.key;
  const d=info[key];
  const r=node.getBoundingClientRect();

  const x=r.left+r.width/2;
  const y=r.top+r.height/2;

  active=key;
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));
  node.classList.add('selected');

  hero.classList.add('focused');
  focus.classList.add('active');

  focus.style.setProperty('--x',x+'px');
  focus.style.setProperty('--y',y+'px');
  ring.style.setProperty('--x',x+'px');
  ring.style.setProperty('--y',y+'px');
  ring.style.setProperty('--accent',d[3]);

  document.getElementById('snapRole').textContent=d[0];
  document.getElementById('snapTitle').textContent=d[1];
  document.getElementById('snapText').textContent=d[2];
  snapshot.style.setProperty('--accent',d[3]);

  const popupOffset = 8;
  snapshot.style.left = `${x + popupOffset}px`;
  snapshot.style.top = `${y}px`;
  snapshot.style.right = 'auto';

  if (x > window.innerWidth * 0.7) {
    snapshot.style.left = `${x - 220}px`;
  }

  snapshot.classList.add('show');

// flash effect removed

  // Move the whole artwork subtly toward the selected node.
  const sx=x-innerWidth/2;
  const sy=y-innerHeight/2;
  stage.style.transform=`translate(calc(-50% + ${-sx*.07}px),calc(-50% + ${-sy*.07}px)) scale(1.025)`;
}

function reset(){
  active=null;
  hero.classList.remove('focused');
  focus.classList.remove('active');
  snapshot.classList.remove('show');
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('selected'));
  stage.style.transform='translate(-50%,-50%)';
}

let hideTimer;
document.querySelectorAll('.node').forEach(node=>{
  node.addEventListener('mouseenter',()=>selectNode(node));
  node.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();selectNode(node)}
  });
});

stage.addEventListener('mouseleave', reset);
document.getElementById('close').addEventListener('click',reset);
document.addEventListener('keydown',e=>{if(e.key==='Escape')reset()});
</script>
</body>
</html>

<style>
.snapshot.show{opacity:1}
</style>
